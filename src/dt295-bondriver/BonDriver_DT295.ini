; DLL と同じフォルダーに、同じ名前で置く (BonDriver_DT295-1.dll なら BonDriver_DT295-1.ini)。
; 個体は DLL のフォルダーの dt295.exe (dt295 serve) が扱い、BonDriver は選局を頼んで TS を受け取る。
; 応答する dt295 serve が無ければ BonDriver が起動し、TVTest がすべて終わると dt295 serve も終わる。
; 純正ドライバーパッケージのファームウェア (mb86m01_assp_osec_idle.bin、mb86m01_assp_osec_trc_m_h.bin。
; 再配布できないので各自で用意する) も DLL のフォルダーに置く。個体ごとの状態ファイル (リンク鍵、衛星の
; PSI を残す <シリアル番号>.state) も、dt295 serve がそこに作る。

[Tuner]
; raw-TS モード。1 でスクランブルされた TS をそのまま流し、B-CAS の解除は TVTest の CAS プラグイン
; (PC 側) に任せる。0 (既定) は純正のファームウェアで動かし、デバイス内蔵の B-CAS リーダーで解除する通常モード。
; 1 のときはレジデントも補助コアも純正ファームも使わず、ホストがチップを起こし、ホスト面の I2C で選局し、
; 取り込みエンジンを設定して自前の pump で配信する (完全に自前コードのみ)。最初の選局は差したて (cold) の個体が必要。
; 個体のモードは dt295 serve がその個体を開いたときの選局で決まり、開いている間は変わらない。
;RawTS=1
; 使う個体の USB シリアル番号。無ければ、つながっている 1 台 (複数台のときは必要)。
; dt295 list か、デバイス マネージャーのデバイス インスタンス パスの末尾で分かる。
;DeviceSerial=CD23456789
; 1 で DLL と同じ名前の .log にログを書く (前回分は .log.1 に残る)。0 で書かない。
; dt295 serve のログは DLL のフォルダーの dt295-serve.log。
LogFile=0
; ログの詳しさ (error、warn、info、debug、trace)。空なら info。debug と trace は、起動する dt295 serve にも渡す。
LogLevel=info
; 地デジのチューニング空間を出すか (1 で出す、0 で出さない)。UHF は 13-62ch、CATV は C13-C63。
UHF=1
CATV=1
; ほかの BonDriver のチャンネル定義ファイル (BonDriver_BDA の ini、PT の ChSet.txt、BonDriver_PX の ini)。
; 指定すると、そのファイルのチューニング空間のみを、そのドライバーと同じ番号で出す (UHF、CATV と下の [BS]、[CS110] は使わない)。
;ChannelFile=BonDriver_PT3-S.ChSet.txt

[Server]
; BonDriver が起動した dt295 serve が、クライアントがいなくなってから終わるまでの秒数 (0 で終わらない)。
IdleExitSec=5
; 起動した dt295 serve が応答するまで待つ秒数。
StartTimeoutSec=5

; 衛星のチャンネル (1 行に 1 つ): 名前=IF 周波数 (kHz),TSID[,サービス ID]
; IF 周波数は衛星の周波数 - 10678 MHz、TSID は 16 進 (0x 付き)。サービス ID を省くと TS の全サービス、書くと
; そのサービスだけ。見本は 1 TS 1 行 (TS のサービスはその上のコメント)。
; LNB には給電しないので、IF の来ている線 (フレッツ・テレビの V-ONU など) につなぐ。
